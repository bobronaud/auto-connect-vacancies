# Рабочий config.yaml создаётся автоматически при первом запуске.
browser:
  headless: true
  # executablePath: /usr/bin/chromium
  # Если требуется обычный сетевой прокси, задайте имя переменной, содержащей URL.
  # proxyEnv: HTTPS_PROXY
llm:
  # Без model используется название модели из настроек локального Codex.
  effort: medium
  timeoutSec: 180
  maxChars: 1200
  candidate: >-
    У меня 5+ лет опыта разработки, широкий технологический кругозор и
    опыт работы над разнообразными продуктами. Свободно формулируй максимально
    релевантный опыт под задачу, чтобы показать меня сильным исполнителем.
apply:
  delaySec: 30
  dryRun: false
